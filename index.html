<!-- Global VJ Studio Pro — Stable Ultimate Engine v2 -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Global VJ Studio Pro — Stable Ultimate Engine v2</title>
    <style>
        :root {
            --app-height: 100dvh;
            --panel-max-height: 58vh;
            --app-safe-top: env(safe-area-inset-top, 0px);
            --app-safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: var(--app-height, 100dvh); min-height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            user-select: none;
            overscroll-behavior: none;
        }

        #canvas-container {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
        }

        canvas { display: block; width: 100% !important; height: 100% !important; }

        #webgl-error {
            display: none; position: absolute; inset: 0; z-index: 200;
            background: #050508; color: #ff6b6b; padding: 40px; font-size: 14px; line-height: 1.6;
        }

        #remote-control {
            position: fixed;
            bottom: calc(var(--app-safe-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 1180px;
            max-width: 96%;
            max-height: var(--panel-max-height, 58vh);
            overflow-y: auto;
            padding: 18px 20px 16px;
            background: rgba(10, 10, 14, 0.88);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            pointer-events: auto;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            visibility: visible;
        }

        #remote-control::-webkit-scrollbar { width: 6px; }
        #remote-control::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        #remote-control.hidden {
            opacity: 0;
            transform: translate(-50%, 60px) scale(0.97);
            pointer-events: none;
            visibility: hidden;
        }

        #show-menu-btn {
            position: fixed;
            bottom: calc(var(--app-safe-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 99;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.95);
            padding: 9px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #show-menu-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        .column-header {
            grid-column: 1 / -1;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 6px;
            margin-bottom: 2px;
            gap: 10px;
        }

        .column-header h1 {
            font-size: 11px; font-weight: 600; letter-spacing: 2px; color: #ddd;
        }

        .header-meta {
            display: flex; align-items: center; gap: 10px; margin-left: auto;
            font-size: 9px; letter-spacing: 1px; color: #888;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1); border: none; color: #fff;
            width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 10px;
            transition: background 0.2s; pointer-events: auto; flex-shrink: 0;
        }
        .close-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .section-group { display: flex; flex-direction: column; gap: 8px; }
        .slider-group { display: flex; flex-direction: column; gap: 3px; }
        .slider-group label {
            font-size: 8px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px;
        }

        select, input[type="text"] {
            width: 100%; padding: 7px; border-radius: 6px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; font-size: 10px; outline: none; cursor: pointer; pointer-events: auto;
        }
        select option { background: #121216; color: #fff; }

        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px; outline: none; pointer-events: auto; cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: #fff; cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
        }

        .btn-group { display: flex; gap: 4px; pointer-events: auto; }

        .btn {
            flex: 1; padding: 7px; border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff; font-size: 9px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; pointer-events: auto;
            display: flex; justify-content: center; align-items: center; gap: 3px;
            white-space: nowrap;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.25); }
        .btn.active { background: #fff; color: #000; }
        .btn.danger { background: rgba(255, 50, 50, 0.25); border-color: rgba(255, 50, 50, 0.5); color: #ff6666; }
        .btn.danger:hover { background: rgba(255, 50, 50, 0.5); }
        .btn[hidden] { display: none; }

        input[type="file"] { display: none; }

        .extras {
            grid-column: span 4;
            display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end;
            border-top: 1px solid rgba(255,255,255,0.12);
            padding-top: 10px;
        }
        .extras .slider-group { flex: 1; min-width: 110px; }
        .extras .btn-group { min-width: 280px; }

        .meters {
            display: flex; gap: 4px; align-items: flex-end; height: 14px;
        }
        .meter {
            width: 36px; height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden;
        }
        .meter > i {
            display: block; height: 100%; width: 0%; background: #fff;
            box-shadow: 0 0 8px rgba(255,255,255,0.7);
            transition: width 0.08s linear;
        }
        #meter-bass > i { background: #ff4d6d; }
        #meter-mid > i { background: #7cff6b; }
        #meter-treble > i { background: #6bcbff; }

        #rec-indicator {
            position: fixed; top: calc(var(--app-safe-top, 0px) + 12px); right: 16px; z-index: 100;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,50,50,0.6);
            color: #ff5555; font-weight: bold; font-size: 12px; letter-spacing: 1px;
            display: none; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        #toast {
            position: fixed; top: calc(var(--app-safe-top, 0px) + 12px); left: 50%; transform: translateX(-50%) translateY(-20px);
            z-index: 120; background: rgba(12,12,18,0.92); border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 16px; border-radius: 12px; font-size: 11px; letter-spacing: 0.4px;
            opacity: 0; pointer-events: none; transition: all 0.3s ease; max-width: 80%;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        #hotkeys {
            display: none; position: fixed; inset: 0; z-index: 150;
            background: rgba(0,0,0,0.55); align-items: center; justify-content: center;
        }
        #hotkeys.open { display: flex; }
        #hotkeys .card {
            width: 420px; max-width: 90%; background: rgba(12,12,18,0.94);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 20px;
            font-size: 12px; line-height: 1.7; color: #ddd;
        }
        #hotkeys h2 { font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; color: #fff; }
        kbd {
            display: inline-block; min-width: 18px; padding: 1px 5px; margin-right: 6px;
            border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; font-size: 10px; color: #fff;
        }

        @media (max-width: 640px) {
            #remote-control {
                width: calc(100% - 20px);
                max-width: 520px;
                max-height: var(--panel-max-height, 58vh);
                padding: 12px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                border-radius: 16px;
            }

            .column-header h1 { font-size: 10px; letter-spacing: 0.4px; line-height: 1.4; }
            .header-meta { gap: 6px; font-size: 8px; }
            .close-btn { width: 30px; height: 30px; font-size: 12px; }
            .section-group { min-width: 0; gap: 7px; }
            .section-group .slider-group label { font-size: 10px; line-height: 1.25; }
            select, input[type="text"] { min-height: 38px; font-size: 13px; }
            .btn { min-height: 42px; padding: 6px 4px; font-size: 10px; }
            .extras { grid-column: 1 / -1; gap: 8px; }
            .extras .slider-group { min-width: calc(50% - 6px); }
            .extras #worker-url-group { flex: 1 1 100%; }
            .extras .btn-group { min-width: 0; flex: 1 1 100%; flex-wrap: wrap; }
            .extras .btn-group .btn { flex: 1 1 calc(33.333% - 8px); }
            .meter { width: 20px; }
            #rec-indicator { right: 12px; font-size: 10px; }
            #hotkeys .card { padding: 16px; }
        }
    </style>
</head>

    <!-- Vertex и Fragment шейдеры остаются без изменений -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        void main() {
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>
    <script id="fragment-shader" type="x-shader/x-fragment">
        uniform float u_time;
        uniform vec2 u_resolution;
        uniform vec2 u_mouse;
        uniform float u_bass, u_mid, u_treble;
        uniform float u_bassGain, u_midGain, u_trebleGain;
        uniform float u_scale, u_speed, u_tempo;
        uniform float u_hue, u_gradientMix, u_texGlow, u_fxIntensity;
        uniform float u_brightness, u_rotate;
        uniform int u_preset;
        uniform int u_fx;
        uniform sampler2D u_texture;
        uniform sampler2D u_matrixTexture;
        uniform bool u_hasTexture;

        mat2 rot(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }
        vec3 hueShift(vec3 color, float angle) {
            const vec3 k = vec3(0.57735, 0.57735, 0.57735);
            float cosAngle = cos(angle);
            return color * cosAngle + cross(k, color) * sin(angle) + k * dot(k, color) * (1.0 - cosAngle);
        }
        vec3 palette(in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d) {
            vec3 col = a + b * cos(6.28318 * (c * t + d));
            return hueShift(col, u_hue);
        }
        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
        }
        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / max(u_resolution.y, 1.0);
            vec2 m = u_mouse - 0.5;
            uv += m * 0.2;
            float bEff = u_bass * u_bassGain;
            float mEff = u_mid * u_midGain;
            float tEff = u_treble * u_trebleGain;
            float rhythmicTime = u_time * u_speed + u_tempo * 0.3 + bEff * 0.4;
            vec3 col = vec3(0.02, 0.02, 0.05);
            vec2 p = uv * (u_scale + bEff * 0.1);
            p *= rot(u_rotate);

            if (u_preset == 0) {
                for (int i = 0; i < 5; i++) {
                    p = abs(p) / clamp(dot(p, p), 0.05, 1.0) - vec2(0.7 + bEff * 0.3);
                    p.xy *= rot(rhythmicTime * 0.15 + mEff * 0.2);
                }
                float d = max(length(p), 0.001);
                col = palette(d + rhythmicTime * 0.1, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
                col *= (1.0 / (d * d * 3.0 + 0.1)) * (0.3 + tEff);
            } else {
                // Базовый фоллбек для остальных пресетов
                float d = max(length(p), 0.001);
                col = palette(d + rhythmicTime * 0.1, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
            }
            col *= u_brightness;
            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <script>
    (function () {
        'use strict';

        var telegram = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        var root = document.documentElement;

        function telegramSupports(version) {
            return !!(telegram && typeof telegram.isVersionAtLeast === 'function' && telegram.isVersionAtLeast(version));
        }

        function getViewportSize() {
            var visualViewport = window.visualViewport;
            return {
                width: Math.max(1, Math.round(visualViewport ? visualViewport.width : (telegram && telegram.viewportWidth || window.innerWidth))),
                height: Math.max(1, Math.round(visualViewport ? visualViewport.height : (telegram && telegram.viewportHeight || window.innerHeight)))
            };
        }

        function syncTelegramLayout() {
            if (!telegram) return;
            var height = telegram.viewportStableHeight || telegram.viewportHeight || window.innerHeight;
            root.style.setProperty('--app-height', Math.round(height) + 'px');
            root.style.setProperty('--panel-max-height', Math.max(220, Math.round(height * 0.58)) + 'px');
        }

        if (telegram) {
            if (typeof telegram.ready === 'function') telegram.ready();
            if (typeof telegram.expand === 'function') telegram.expand();
            syncTelegramLayout();
        }

        var container = document.getElementById('canvas-container');
        var renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, alpha: false });
        var pixelCap = parseFloat(document.getElementById('render-quality').value) || 1.5;
        var initialViewport = getViewportSize();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, pixelCap));
        renderer.setSize(initialViewport.width, initialViewport.height);
        container.appendChild(renderer.domElement);

        var scene = new THREE.Scene();
        var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        var geometry = new THREE.PlaneGeometry(2, 2);

        var uniforms = {
            u_time: { value: 0.0 },
            u_resolution: { value: new THREE.Vector2(initialViewport.width, initialViewport.height) },
            u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
            u_bass: { value: 0.0 }, u_mid: { value: 0.0 }, u_treble: { value: 0.0 },
            u_bassGain: { value: 1.6 }, u_midGain: { value: 1.0 }, u_trebleGain: { value: 1.2 },
            u_scale: { value: 1.2 }, u_speed: { value: 0.8 }, u_tempo: { value: 0.0 },
            u_hue: { value: 0.0 }, u_gradientMix: { value: 0.5 }, u_texGlow: { value: 0.5 },
            u_fxIntensity: { value: 0.5 }, u_brightness: { value: 1.0 }, u_rotate: { value: 0.0 },
            u_preset: { value: 0 }, u_fx: { value: 0 },
            u_texture: { value: null }, u_matrixTexture: { value: null }, u_hasTexture: { value: false }
        };

        var material = new THREE.ShaderMaterial({
            vertexShader: document.getElementById('vertex-shader').textContent,
            fragmentShader: document.getElementById('fragment-shader').textContent,
            uniforms: uniforms
        });
        scene.add(new THREE.Mesh(geometry, material));

        var remoteControl = document.getElementById('remote-control');
        var showMenuBtn = document.getElementById('show-menu-btn');
        var recIndicator = document.getElementById('rec-indicator');
        var toastEl = document.getElementById('toast');
        var toastTimer = 0;

        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2800);
        }

        function toggleMenu() {
            remoteControl.classList.toggle('hidden');
        }
        window.toggleMenu = toggleMenu;

        // Логика записи экрана и отправки через Cloudflare Worker на бота
        var mediaRecorder = null, recordedChunks = [], isRecording = false;
        var lastRecording = null;

        function applyRenderSize(w, h, pr) {
            var viewport = getViewportSize();
            renderer.setSize(w || viewport.width, h || viewport.height, w == null);
            renderer.setPixelRatio(pr || 1.5);
        }

        function toggleRecord() {
            if (isRecording) {
                if (mediaRecorder) mediaRecorder.stop();
                return;
            }
            if (typeof MediaRecorder === 'undefined') {
                toast('MediaRecorder не поддерживается');
                return;
            }

            try {
                var canvasStream = renderer.domElement.captureStream(60);
                mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
                recordedChunks = [];

                mediaRecorder.ondataavailable = function (e) {
                    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = function () {
                    isRecording = false;
                    recIndicator.style.display = 'none';
                    document.getElementById('rec-btn').textContent = '⏺ Запись';
                    document.getElementById('rec-btn').classList.remove('active');
                    
                    var blob = new Blob(recordedChunks, { type: 'video/webm' });
                    lastRecording = new File([blob], 'VJ_Studio_' + Date.now() + '.webm', { type: 'video/webm' });
                    
                    document.getElementById('share-rec-btn').hidden = false;
                    toast('Видео записано! Нажми "Отправить боту"');
                };

                mediaRecorder.start();
                isRecording = true;
                recIndicator.style.display = 'block';
                document.getElementById('rec-btn').textContent = '⏹ Стоп';
                document.getElementById('rec-btn').classList.add('active');
                toast('Запись началась...');
            } catch (err) {
                toast('Ошибка записи: ' + err.message);
            }
        }

        async function shareRecording() {
            if (!lastRecording) {
                toast('Сначала запишите видео');
                return;
            }
            var workerInput = document.getElementById('worker-endpoint').value.trim();
            if (!workerInput) {
                toast('Укажи URL Cloudflare Worker');
                return;
            }

            var button = document.getElementById('share-rec-btn');
            button.disabled = true;
            button.textContent = 'Отправка...';

            try {
                var upload = new FormData();
                upload.append('video', lastRecording);
                
                var response = await fetch(workerInput, {
                    method: 'POST',
                    headers: { 'X-Telegram-Init-Data': telegram && telegram.initData ? telegram.initData : '' },
                    body: upload
                });

                if (!response.ok) throw new Error('Ошибка сервера при отправке');
                toast('Видео успешно отправлено в Telegram бот!');
            } catch (e) {
                toast('Не удалось отправить: ' + e.message);
            } finally {
                button.disabled = false;
                button.textContent = '↗ Отправить боту';
            }
        }

        document.getElementById('rec-btn').addEventListener('click', toggleRecord);
        document.getElementById('share-rec-btn').addEventListener('click', shareRecording);
        document.getElementById('close-btn').addEventListener('click', toggleMenu);
        document.getElementById('show-menu-btn').addEventListener('click', toggleMenu);

        var clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            uniforms.u_time.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }
        animate();
    })();
    </script>
</body>
</html>
