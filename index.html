<!-- Global VJ Studio Pro — Stable Ultimate Engine v2 -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Global VJ Studio Pro — Stable Ultimate Engine v2</title>
    <style>
        :root {
            --app-height: 100dvh;
            --panel-max-height: 58vh;
            --app-safe-top: env(safe-area-inset-top, 0px);
            --app-safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: var(--app-height, 100dvh); min-height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            user-select: none;
            overscroll-behavior: none;
        }

        #canvas-container {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
        }

        canvas { display: block; width: 100% !important; height: 100% !important; }

        #webgl-error {
            display: none; position: absolute; inset: 0; z-index: 200;
            background: #050508; color: #ff6b6b; padding: 40px; font-size: 14px; line-height: 1.6;
        }

        #remote-control {
            position: fixed;
            bottom: calc(var(--app-safe-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 1180px;
            max-width: 96%;
            max-height: var(--panel-max-height, 58vh);
            overflow-y: auto;
            padding: 18px 20px 16px;
            background: rgba(10, 10, 14, 0.88);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            pointer-events: auto;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            visibility: visible;
        }

        #remote-control::-webkit-scrollbar { width: 6px; }
        #remote-control::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        #remote-control.hidden {
            opacity: 0;
            transform: translate(-50%, 60px) scale(0.97);
            pointer-events: none;
            visibility: hidden;
        }

        #show-menu-btn {
            position: fixed;
            bottom: calc(var(--app-safe-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 99;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.95);
            padding: 9px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #show-menu-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        .column-header {
            grid-column: 1 / -1;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 6px;
            margin-bottom: 2px;
            gap: 10px;
        }

        .column-header h1 {
            font-size: 11px; font-weight: 600; letter-spacing: 2px; color: #ddd;
        }

        .header-meta {
            display: flex; align-items: center; gap: 10px; margin-left: auto;
            font-size: 9px; letter-spacing: 1px; color: #888;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1); border: none; color: #fff;
            width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 10px;
            transition: background 0.2s; pointer-events: auto; flex-shrink: 0;
        }
        .close-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .section-group { display: flex; flex-direction: column; gap: 8px; }
        .slider-group { display: flex; flex-direction: column; gap: 3px; }
        .slider-group label {
            font-size: 8px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px;
        }

        select, input[type="text"] {
            width: 100%; padding: 7px; border-radius: 6px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; font-size: 10px; outline: none; cursor: pointer; pointer-events: auto;
        }
        select option { background: #121216; color: #fff; }

        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px; outline: none; pointer-events: auto; cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: #fff; cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
        }

        .btn-group { display: flex; gap: 4px; pointer-events: auto; }

        .btn {
            flex: 1; padding: 7px; border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff; font-size: 9px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; pointer-events: auto;
            display: flex; justify-content: center; align-items: center; gap: 3px;
            white-space: nowrap;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.25); }
        .btn.active { background: #fff; color: #000; }
        .btn.danger { background: rgba(255, 50, 50, 0.25); border-color: rgba(255, 50, 50, 0.5); color: #ff6666; }
        .btn.danger:hover { background: rgba(255, 50, 50, 0.5); }
        .btn[hidden] { display: none; }

        input[type="file"] { display: none; }

        .extras {
            grid-column: span 4;
            display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end;
            border-top: 1px solid rgba(255,255,255,0.12);
            padding-top: 10px;
        }
        .extras .slider-group { flex: 1; min-width: 110px; }
        .extras .btn-group { min-width: 280px; }

        .meters {
            display: flex; gap: 4px; align-items: flex-end; height: 14px;
        }
        .meter {
            width: 36px; height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden;
        }
        .meter > i {
            display: block; height: 100%; width: 0%; background: #fff;
            box-shadow: 0 0 8px rgba(255,255,255,0.7);
            transition: width 0.08s linear;
        }
        #meter-bass > i { background: #ff4d6d; }
        #meter-mid > i { background: #7cff6b; }
        #meter-treble > i { background: #6bcbff; }

        #rec-indicator {
            position: fixed; top: calc(var(--app-safe-top, 0px) + 12px); right: 16px; z-index: 100;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,50,50,0.6);
            color: #ff5555; font-weight: bold; font-size: 12px; letter-spacing: 1px;
            display: none; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        #toast {
            position: fixed; top: calc(var(--app-safe-top, 0px) + 12px); left: 50%; transform: translateX(-50%) translateY(-20px);
            z-index: 120; background: rgba(12,12,18,0.92); border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 16px; border-radius: 12px; font-size: 11px; letter-spacing: 0.4px;
            opacity: 0; pointer-events: none; transition: all 0.3s ease; max-width: 80%;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        #hotkeys {
            display: none; position: fixed; inset: 0; z-index: 150;
            background: rgba(0,0,0,0.55); align-items: center; justify-content: center;
        }
        #hotkeys.open { display: flex; }
        #hotkeys .card {
            width: 420px; max-width: 90%; background: rgba(12,12,18,0.94);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 20px;
            font-size: 12px; line-height: 1.7; color: #ddd;
        }
        #hotkeys h2 { font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; color: #fff; }
        kbd {
            display: inline-block; min-width: 18px; padding: 1px 5px; margin-right: 6px;
            border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; font-size: 10px; color: #fff;
        }

        @media (max-width: 640px) {
            #remote-control {
                width: calc(100% - 20px);
                max-width: 520px;
                max-height: var(--panel-max-height, 58vh);
                padding: 12px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                border-radius: 16px;
            }

            .column-header h1 { font-size: 10px; letter-spacing: 0.4px; line-height: 1.4; }
            .header-meta { gap: 6px; font-size: 8px; }
            .close-btn { width: 30px; height: 30px; font-size: 12px; }
            .section-group { min-width: 0; gap: 7px; }
            .section-group .slider-group label { font-size: 10px; line-height: 1.25; }
            select, input[type="text"] { min-height: 38px; font-size: 13px; }
            .btn { min-height: 42px; padding: 6px 4px; font-size: 10px; }
            .extras { grid-column: 1 / -1; gap: 8px; }
            .extras .slider-group { min-width: calc(50% - 6px); }
            .extras .btn-group { min-width: 0; flex: 1 1 100%; flex-wrap: wrap; }
            .extras .btn-group .btn { flex: 1 1 calc(33.333% - 8px); }
            .meter { width: 20px; }
            #rec-indicator { right: 12px; font-size: 10px; }
            #hotkeys .card { padding: 16px; }
        }
    </style>
</head>
<body>
    <div id="webgl-error"></div>
    <div id="rec-indicator">⏺ REC</div>
    <div id="toast"></div>
    <div id="canvas-container"></div>
    <div id="hotkeys">
        <div class="card">
            <h2>HOTKEYS</h2>
            <div><kbd>H</kbd><kbd>Esc</kbd> меню</div>
            <div><kbd>Space</kbd> старт / пауза</div>
            <div><kbd>R</kbd> запись</div>
            <div><kbd>F</kbd> полный экран</div>
            <div><kbd>S</kbd> скриншот PNG</div>
            <div><kbd>M</kbd> микрофон</div>
            <div><kbd>1</kbd>–<kbd>9</kbd><kbd>0</kbd><kbd>-</kbd><kbd>=</kbd> пресеты</div>
            <div><kbd>←</kbd><kbd>→</kbd> пресет &nbsp; <kbd>↑</kbd><kbd>↓</kbd> FX</div>
            <div><kbd>G</kbd> randomize &nbsp; <kbd>A</kbd> auto hue &nbsp; <kbd>L</kbd> loop</div>
            <div><kbd>?</kbd> эта справка</div>
        </div>
    </div>

    <input type="file" id="audio-upload" accept="audio/*">
    <input type="file" id="image-upload" accept="image/*">

    <div id="remote-control">
        <div class="column-header">
            <h1>GLOBAL VJ STUDIO // STABLE ENGINE v2</h1>

                <span id="fps-label">60 FPS</span>

                    <div class="meter" id="meter-bass"><i></i></div>

                    <div class="meter" id="meter-treble"><i></i></div>
                </div>
            </div>
            <button class="close-btn" id="close-btn" title="Скрыть меню">✕</button>
        </div>

        <div class="section-group">
            <div class="slider-group">
                <label>Фрактал (1-9, 0, -, =)</label>
                <select id="preset-select">
                    <option value="0">01. Neon Cyber Matrix</option>
                    <option value="1">02. Liquid Plasma 4D</option>
                    <option value="2">03. Deep Space Portal</option>
                    <option value="3">04. Quantum Tesseract</option>
                    <option value="4">05. Sacred Mandala</option>
                    <option value="5">06. Neural Field</option>
                    <option value="6">07. Cyber Vortex</option>
                    <option value="7">08. Crystal Prism</option>
                    <option value="8">09. Solar Flare</option>
                    <option value="9">10. Bio-Organic Node</option>
                    <option value="10">11. Synthwave Horizon</option>
                    <option value="11">12. Digital Singularity</option>
                    <option value="12">13. Kaleidoscope</option>
                </select>
            </div>
            <div class="slider-group">
                <label>Масштаб</label>
                <input type="range" id="param-scale" min="0.3" max="3.0" step="0.05" value="1.2">
            </div>
            <div class="slider-group">
                <label>Скорость 4D</label>
                <input type="range" id="param-speed" min="0.1" max="2.0" step="0.1" value="0.8">

            <div class="slider-group">
                <label>Вращение</label>
                <input type="range" id="param-rotate" min="0.0" max="6.28" step="0.01" value="0.0">

        <div class="section-group">
            <div class="slider-group">

                    <option value="10">10. Hexagonal Cyber Grid</option>
                    <option value="11">11. Strobe Flash Pulse</option>
                    <option value="12">12. Hologram Flickering</option>

            <div class="slider-group">

                <input type="text" id="matrix-text-input" value="SHIMON VIBE 4K" placeholder="Введите текст...">

            <div class="slider-group">
                <label>Интенсивность FX</label>
                <input type="range" id="param-fx-intensity" min="0.0" max="2.0" step="0.05" value="0.5">
            </div>
            <div class="slider-group">
                <label>Свечение текстуры</label>
                <input type="range" id="param-tex-glow" min="0.0" max="3.0" step="0.05" value="0.5">

        <div class="section-group">

            <div class="btn-group">
                <button class="btn" id="btn-audio">🎵 Трек</button>
                <button class="btn" id="btn-image">🖼 Фото</button>
                <button class="btn" id="btn-mic">🎙 Mic</button>
            </div>
            <div class="slider-group">
                <label>Смешивание палитр</label>
                <input type="range" id="param-gradient-mix" min="0.0" max="1.0" step="0.05" value="0.5">
            </div>
            <div class="slider-group">
                <label>Экспозиция</label>
                <input type="range" id="param-brightness" min="0.2" max="2.5" step="0.05" value="1.0">

            <div class="btn-group">
                <button class="btn" id="play-btn">▶ Старт</button>

        </div>

        <div class="extras">
            <div class="slider-group">
                <label>Качество записи</label>
                <select id="rec-quality">
                    <option value="2160@60">4K 60 FPS (Ultra)</option>

                    <option value="720@60">720p 60 FPS</option>

    </div>

    <button id="show-menu-btn">⚙ ПУЛЬТ УПРАВЛЕНИЯ</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script id="vertex-shader" type="x-shader/x-vertex">
        void main() {
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        uniform float u_time;
        uniform vec2 u_resolution;
        uniform vec2 u_mouse;
        uniform float u_bass, u_mid, u_treble;
        uniform float u_bassGain, u_midGain, u_trebleGain;
        uniform float u_scale, u_speed, u_tempo;
        uniform float u_hue, u_gradientMix, u_texGlow, u_fxIntensity;
        uniform float u_brightness, u_rotate;
        uniform int u_preset;
        uniform int u_fx;
        uniform sampler2D u_texture;
        uniform sampler2D u_matrixTexture;
        uniform bool u_hasTexture;

        mat2 rot(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }

        vec3 hueShift(vec3 color, float angle) {
            const vec3 k = vec3(0.57735, 0.57735, 0.57735);
            float cosAngle = cos(angle);
            return color * cosAngle + cross(k, color) * sin(angle) + k * dot(k, color) * (1.0 - cosAngle);
        }

        vec3 palette(in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d) {
            vec3 col = a + b * cos(6.28318 * (c * t + d));
            return hueShift(col, u_hue);
        }

        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / max(u_resolution.y, 1.0);
            vec2 m = u_mouse - 0.5;
            uv += m * 0.2;

            float bEff = u_bass * u_bassGain;
            float mEff = u_mid * u_midGain;
            float tEff = u_treble * u_trebleGain;
            float rhythmicTime = u_time * u_speed + u_tempo * 0.3 + bEff * 0.4;

            vec3 col = vec3(0.02, 0.02, 0.05);
            vec2 p = uv * (u_scale + bEff * 0.1);
            p *= rot(u_rotate);

            if (u_preset == 0) {
                for (int i = 0; i < 5; i++) {
                    p = abs(p) / clamp(dot(p, p), 0.05, 1.0) - vec2(0.7 + bEff * 0.3);
                    p.xy *= rot(rhythmicTime * 0.15 + mEff * 0.2);
                }
                float d = max(length(p), 0.001);
                col = palette(d + rhythmicTime * 0.1, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
                col *= (1.0 / (d * d * 3.0 + 0.1)) * (0.3 + tEff);
            } else if (u_preset == 1) {
                p.x += sin(p.y * 5.0 + rhythmicTime) * (0.2 + bEff * 0.5);
                p.y += cos(p.x * 5.0 - rhythmicTime) * (0.2 + mEff * 0.5);
                float wave = sin(p.x * 12.0 + rhythmicTime) * cos(p.y * 12.0 - rhythmicTime);
                col = palette(wave + rhythmicTime * 0.2, vec3(0.8, 0.2, 0.5), vec3(0.2, 0.5, 0.8), vec3(1.0), vec3(0.0, 0.3, 0.7));
                col *= (tEff + 0.5 + bEff * 0.5) * abs(p.x + p.y + 0.01);
            } else if (u_preset == 2) {
                float len = max(length(p), 0.001);
                vec2 uvP = vec2(atan(p.y, p.x) * 1.5708, 0.3 / len - rhythmicTime * 0.8);
                col = palette(uvP.y + bEff, vec3(0.5), vec3(0.5), vec3(2.0, 1.0, 0.0), vec3(0.5, 0.2, 0.25));
                col *= (1.0 - smoothstep(0.0, 1.8, len)) * (1.0 + tEff * 1.5);
            } else if (u_preset == 3) {
                p.xy *= rot(rhythmicTime * 0.3);
                vec2 q = abs(p) - (0.4 + bEff * 0.2);

                toast('Микрофон: визуалы без мониторинга');
            } catch (e) {
                toast('Нет доступа к микрофону: ' + e.message);
            }
        }

        function bind(id, evt, fn) {
            var el = document.getElementById(id);
            if (!el) return;
            el.addEventListener(evt, fn);
        }

        function bindRange(id, uniformKey, parser) {
            parser = parser || parseFloat;
            var el = document.getElementById(id);
            if (!el) return;
            var apply = function () { uniforms[uniformKey].value = parser(el.value); persistSoon(); };
            el.addEventListener('input', apply);
            el.addEventListener('change', apply);
        }

        bindRange('param-scale', 'u_scale');
        bindRange('param-speed', 'u_speed');
        bindRange('param-bass-gain', 'u_bassGain');
        bindRange('param-mid-gain', 'u_midGain');
        bindRange('param-treble-gain', 'u_trebleGain');
        bindRange('param-hue', 'u_hue');
        bindRange('param-gradient-mix', 'u_gradientMix');
        bindRange('param-tex-glow', 'u_texGlow');
        bindRange('param-fx-intensity', 'u_fxIntensity');
        bindRange('param-brightness', 'u_brightness');
        bindRange('param-rotate', 'u_rotate');

        bind('preset-select', 'change', function (e) {
            uniforms.u_preset.value = parseInt(e.target.value, 10);
            persistSoon();
        });
        bind('fx-select', 'change', function (e) {
            uniforms.u_fx.value = parseInt(e.target.value, 10);
            persistSoon();
        });
        bind('param-volume', 'input', function (e) {
            if (trackGain) trackGain.gain.value = parseFloat(e.target.value);
            persistSoon();
        });
        bind('render-quality', 'change', function () {
            if (!isRecording) applyRenderSize();
            persistSoon();
        });
        bind('matrix-text-input', 'input', persistSoon);

        bind('close-btn', 'click', toggleMenu);
        bind('show-menu-btn', 'click', toggleMenu);
        bind('btn-audio', 'click', function () { document.getElementById('audio-upload').click(); });
        bind('btn-image', 'click', function () { document.getElementById('image-upload').click(); });
        bind('audio-upload', 'change', function (e) { if (e.target.files[0]) loadAudio(e.target.files[0]); });
        bind('image-upload', 'change', function (e) { if (e.target.files[0]) loadImage(e.target.files[0]); });
        bind('play-btn', 'click', togglePlay);
        bind('btn-mic', 'click', function () { toggleMic(); });
        bind('btn-fs', 'click', toggleFullscreen);
        bind('btn-shot', 'click', takeScreenshot);
        bind('btn-random', 'click', randomize);
        bind('btn-help', 'click', function () {
            hotkeys.classList.toggle('open');
            syncTelegramBackButton();
        });
        bind('hotkeys', 'click', function (e) {
            if (e.target.id === 'hotkeys') {
                e.currentTarget.classList.remove('open');
                syncTelegramBackButton();
            }
        });

        bind('btn-loop', 'click', function () {
            audioElement.loop = !audioElement.loop;
            document.getElementById('btn-loop').classList.toggle('active', audioElement.loop);
            toast(audioElement.loop ? 'Loop ON' : 'Loop OFF');
            persistSoon();
        });
        document.getElementById('btn-loop').classList.add('active');

        var autoHue = false;
        bind('btn-autohue', 'click', function () {
            autoHue = !autoHue;
            document.getElementById('btn-autohue').classList.toggle('active', autoHue);
            toast(autoHue ? 'Auto Hue ON' : 'Auto Hue OFF');
        });

        audioElement.addEventListener('ended', function () {
            if (!audioElement.loop) setPlayingUI(false);
        });
        audioElement.addEventListener('error', function () { toast('Ошибка декодирования аудио'); });

        window.addEventListener('dragover', function (e) { e.preventDefault(); });
        window.addEventListener('drop', function (e) {
            e.preventDefault();
            var file = e.dataTransfer.files && e.dataTransfer.files[0];
            if (!file) return;
            if (file.type.indexOf('audio') === 0) loadAudio(file);
            else if (file.type.indexOf('image') === 0) loadImage(file);
            else toast('Нужен audio/* или image/*');
        });

        function setPreset(idx) {
            idx = ((idx % PRESET_COUNT) + PRESET_COUNT) % PRESET_COUNT;
            document.getElementById('preset-select').value = String(idx);
            uniforms.u_preset.value = idx;
            haptic('selection');
            persistSoon();
        }
        function setFx(idx) {
            idx = ((idx % FX_COUNT) + FX_COUNT) % FX_COUNT;
            document.getElementById('fx-select').value = String(idx);
            uniforms.u_fx.value = idx;
            haptic('selection');
            persistSoon();
        }

        function randomize() {
            setPreset((Math.random() * PRESET_COUNT) | 0);
            setFx((Math.random() * FX_COUNT) | 0);
            var map = {
                'param-scale': [0.6, 2.2],
                'param-speed': [0.4, 1.6],
                'param-hue': [0, 6.28],
                'param-gradient-mix': [0.15, 0.85],
                'param-fx-intensity': [0.25, 1.2],
                'param-rotate': [0, 6.28]
            };
            Object.keys(map).forEach(function (id) {
                var r = map[id];
                var v = r[0] + Math.random() * (r[1] - r[0]);
                var el = document.getElementById(id);
                el.value = v.toFixed(2);
                el.dispatchEvent(new Event('input'));
            });
            toast('Randomize');
        }

        function toggleFullscreen() {
            if (telegramSupports('8.0') && typeof telegram.requestFullscreen === 'function') {
                try {
                    if (telegram.isFullscreen && typeof telegram.exitFullscreen === 'function') {
                        telegram.exitFullscreen();
                    } else {
                        telegram.requestFullscreen();
                    }
                } catch (e) {
                    toast('Полноэкранный режим недоступен: ' + e.message);
                }
                return;
            }
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(function (e) { toast(e.message); });
                } else {
                    toast('Полноэкранный режим не поддерживается');
                }
            } else {
                document.exitFullscreen();
            }
        }

        function takeScreenshot() {
            renderer.render(scene, camera);
            var a = document.createElement('a');
            a.href = renderer.domElement.toDataURL('image/png');
            a.download = 'VJ_Studio_' + Date.now() + '.png';
            a.click();
            toast('Скриншот PNG');
        }

        window.addEventListener('keydown', function (e) {
            if (e.target.matches('input, textarea, select')) return;
            var k = e.key;
            if (k === 'h' || k === 'H' || k === 'Escape') { toggleMenu(); return; }
            if (k === ' ') { e.preventDefault(); togglePlay(); return; }
            if (k === 'r' || k === 'R') { e.preventDefault(); toggleRecord(); return; }
            if (k === 'f' || k === 'F') { toggleFullscreen(); return; }
            if (k === 's' || k === 'S') { takeScreenshot(); return; }
            if (k === 'm' || k === 'M') { toggleMic(); return; }
            if (k === 'g' || k === 'G') { randomize(); return; }
            if (k === 'a' || k === 'A') { document.getElementById('btn-autohue').click(); return; }
            if (k === 'l' || k === 'L') { document.getElementById('btn-loop').click(); return; }
            if (k === '?' || k === '/') { document.getElementById('hotkeys').classList.toggle('open'); return; }
            if (k >= '1' && k <= '9') { setPreset(parseInt(k, 10) - 1); return; }
            if (k === '0') { setPreset(9); return; }
            if (k === '-') { setPreset(10); return; }
            if (k === '=' || k === '+') { setPreset(11); return; }
            if (k === 'ArrowLeft') { setPreset(uniforms.u_preset.value - 1); return; }
            if (k === 'ArrowRight') { setPreset(uniforms.u_preset.value + 1); return; }
            if (k === 'ArrowUp') { setFx(uniforms.u_fx.value + 1); return; }
            if (k === 'ArrowDown') { setFx(uniforms.u_fx.value - 1); return; }
        });

        var mediaRecorder = null, recordedChunks = [], isRecording = false;
        var recStartedAt = 0, recTimer = 0;
        var recRestore = { w: 0, h: 0, pr: 1 };
        var lastRecording = null;

        function pickMime() {
            var types = [
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8,opus',
                'video/webm;codecs=vp8',
                'video/webm',
                'video/mp4'
            ];
            if (typeof MediaRecorder === 'undefined') return '';
            for (var t = 0; t < types.length; t++) {
                if (MediaRecorder.isTypeSupported(types[t])) return types[t];
            }
            return '';
        }

        function parseQuality() {
            var raw = document.getElementById('rec-quality').value || '1080@60';
            var parts = raw.split('@');
            var h = parseInt(parts[0], 10);
            var fps = parseInt(parts[1], 10) || 60;
            var map = { 2160: [3840, 2160], 1080: [1920, 1080], 720: [1280, 720] };
            var wh = map[h] || [1920, 1080];
            return { w: wh[0], h: wh[1], fps: fps };
        }

        function applyRenderSize(forceW, forceH, forcePr) {
            var pr = forcePr != null ? forcePr : Math.min(window.devicePixelRatio || 1, parseFloat(document.getElementById('render-quality').value) || 1.5);
            var viewport = getViewportSize();
            var w = forceW || viewport.width;
            var h = forceH || viewport.height;
            renderer.setPixelRatio(pr);
            renderer.setSize(w, h, forceW == null);
            var bufW = Math.floor(w * pr);
            var bufH = Math.floor(h * pr);
            uniforms.u_resolution.value.set(bufW, bufH);
        }

        function formatRecTime(ms) {
            var s = Math.floor(ms / 1000);
            var m = Math.floor(s / 60);
            s = s % 60;
            return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        function stopRecord() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch (e) {}
            }
        }

        function toggleRecord() {
            if (isRecording) { stopRecord(); return; }
            if (typeof MediaRecorder === 'undefined') {
                toast('MediaRecorder не поддерживается');
                return;
            }

            lastRecording = null;
            document.getElementById('share-rec-btn').hidden = true;

            var q = parseQuality();
            var attempts = [
                { w: q.w, h: q.h, fps: q.fps },
                { w: 1920, h: 1080, fps: Math.min(q.fps, 60) },
                { w: 1280, h: 720, fps: 30 }
            ];

            var viewport = getViewportSize();
            recRestore.w = viewport.width;
            recRestore.h = viewport.height;
            recRestore.pr = renderer.getPixelRatio();

            var mime = pickMime();
            var started = false;
            var lastErr = '';

            for (var a = 0; a < attempts.length && !started; a++) {
                var mode = attempts[a];
                try {
                    applyRenderSize(mode.w, mode.h, 1);
                    renderer.render(scene, camera);
                    var canvasStream = renderer.domElement.captureStream(mode.fps);
                    var mixed = canvasStream;
                    if (recDest) {
                        mixed = new MediaStream(canvasStream.getVideoTracks().concat(recDest.stream.getAudioTracks()));
                    }
                    var opts = { videoBitsPerSecond: mode.w >= 3840 ? 28000000 : mode.w >= 1920 ? 14000000 : 8000000 };
                    if (mime) opts.mimeType = mime;
                    if (recDest && recDest.stream.getAudioTracks().length) opts.audioBitsPerSecond = 192000;
                    mediaRecorder = new MediaRecorder(mixed, opts);
                    recordedChunks = [];
                    mediaRecorder.ondataavailable = function (e) {
                        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                    };
                    mediaRecorder.onerror = function (ev) {
                        toast('Ошибка записи: ' + (ev.error && ev.error.message || 'unknown'));
                    };
                    mediaRecorder.onstop = function () {
                        isRecording = false;
                        recIndicator.style.display = 'none';
                        clearInterval(recTimer);
                        document.getElementById('rec-btn').textContent = '⏺ Запись';
                        document.getElementById('rec-btn').classList.remove('active');
                        applyRenderSize();
                        canvasStream.getTracks().forEach(function (track) { track.stop(); });
                        if (!recordedChunks.length) {
                            toast('Пустая запись — кодек/ holster canvas не отдал кадры');
                            return;
                        }
                        var type = (mediaRecorder && mediaRecorder.mimeType) || 'video/webm';
                        var blob = new Blob(recordedChunks, { type: type });
                        var ext = type.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
                        var fileName = 'VJ_Studio_' + mode.w + 'x' + mode.h + '_' + Date.now() + '.' + ext;
                        lastRecording = typeof File === 'function' ? new File([blob], fileName, { type: type }) : blob;
                        var url = URL.createObjectURL(blob);
                        var link = document.createElement('a');
                        link.href = url;
                        link.download = fileName;
                        link.rel = 'noopener';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
                        recordedChunks = [];
                        document.getElementById('share-rec-btn').hidden = false;
                        toast('Сохранено ' + (blob.size / 1048576).toFixed(1) + ' MB');
                    };
                    mediaRecorder.start(1000);
                    started = true;
                    isRecording = true;
                    recStartedAt = Date.now();
                    recIndicator.style.display = 'block';
                    recIndicator.textContent = '⏺ REC ' + mode.w + '×' + mode.h + ' @' + mode.fps;
                    recTimer = setInterval(function () {
                        recIndicator.textContent = '⏺ REC ' + mode.w + '×' + mode.h + ' @' + mode.fps + '  ' + formatRecTime(Date.now() - recStartedAt);
                    }, 250);
                    document.getElementById('rec-btn').textContent = '⏹ Стоп';
                    document.getElementById('rec-btn').classList.add('active');
                    if (a > 0) toast('Fallback запись: ' + mode.w + '×' + mode.h + '@' + mode.fps);
                    else toast('Запись ' + mode.w + '×' + mode.h + '@' + mode.fps + (mime ? ' · ' + mime : ''));
                } catch (err) {
                    lastErr = err.message;
                }
            }

            if (!started) {
                applyRenderSize();
                toast('Не удалось начать запись: ' + lastErr);
            }
        }

        async function shareRecording() {
            if (!lastRecording) {
                toast('Сначала запишите видео');
                return;
            }
            if (typeof navigator.share !== 'function') {
                toast('Видео скачано. Прикрепите файл к чату бота вручную');
                return;
            }
            try {
                var shareData = { files: [lastRecording], title: 'Global VJ Studio' };
                if (typeof navigator.canShare === 'function' && !navigator.canShare(shareData)) {
                    toast('Этот Telegram WebView не поддерживает отправку видео из приложения');
                    return;
                }
                await navigator.share(shareData);
                toast('Выберите чат бота в меню отправки');
            } catch (e) {
                if (e.name !== 'AbortError') toast('Не удалось открыть отправку: ' + e.message);
            }
        }

        bind('rec-btn', 'click', toggleRecord);
        bind('share-rec-btn', 'click', shareRecording);

        var persistT = 0;
        function persistSoon() {
            clearTimeout(persistT);
            persistT = setTimeout(saveState, 250);
        }

        function saveState() {
            var ids = [
                'preset-select', 'fx-select', 'param-scale', 'param-speed', 'param-bass-gain',
                'param-mid-gain', 'param-treble-gain', 'param-hue', 'param-gradient-mix',
                'param-tex-glow', 'param-fx-intensity', 'param-brightness', 'param-rotate',
                'param-volume', 'rec-quality', 'render-quality', 'matrix-text-input'
            ];
            var o = { loop: audioElement.loop };
            ids.forEach(function (id) {
                var el = document.getElementById(id);
                if (el) o[id] = el.value;
            });
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(o)); } catch (e) {}
        }

        function restoreState() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                var o = JSON.parse(raw);
                Object.keys(o).forEach(function (id) {
                    if (id === 'loop') return;
                    var el = document.getElementById(id);
                    if (el) {
                        el.value = o[id];
                        el.dispatchEvent(new Event('input'));
                        el.dispatchEvent(new Event('change'));
                    }
                });
                if (typeof o.loop === 'boolean') {
                    audioElement.loop = o.loop;
                    document.getElementById('btn-loop').classList.toggle('active', o.loop);
                }
            } catch (e) {}
        }

        var clock = new THREE.Clock();
        var fpsFrames = 0, fpsLast = performance.now();
        var fpsLabel = document.getElementById('fps-label');
        var meterBass = document.querySelector('#meter-bass i');
        var meterMid = document.querySelector('#meter-mid i');
        var meterTreble = document.querySelector('#meter-treble i');

        function animate() {
            requestAnimationFrame(animate);
            updateAudioData();

            var t = clock.getElapsedTime();
            if (autoHue) {
                uniforms.u_hue.value = (t * 0.15) % 6.28318;
                document.getElementById('param-hue').value = uniforms.u_hue.value.toFixed(2);
            }

            if (uniforms.u_fx.value === 1) {
                drawMatrixRain(document.getElementById('matrix-text-input').value);
                matrixTexture.needsUpdate = true;
            }

            mouse.x += (mouse.targetX - mouse.x) * 0.1;
            mouse.y += (mouse.targetY - mouse.y) * 0.1;
            uniforms.u_mouse.value.set(mouse.x, mouse.y);
            uniforms.u_time.value = t;

            var idle = (!hasAudioSignal && !micOn && audioElement.paused) ? (0.12 + 0.08 * Math.sin(t * 0.7)) : 0;
            uniforms.u_bass.value = audioData.bass + idle;
            uniforms.u_mid.value = audioData.mid + idle * 0.6;
            uniforms.u_treble.value = audioData.treble + idle * 0.4;
            uniforms.u_tempo.value = tempoFactor;

            meterBass.style.width = Math.min(100, audioData.bass * 140) + '%';
            meterMid.style.width = Math.min(100, audioData.mid * 140) + '%';
            meterTreble.style.width = Math.min(100, audioData.treble * 140) + '%';

            fpsFrames++;
            var now = performance.now();
            if (now - fpsLast >= 500) {
                var fps = Math.round(fpsFrames * 1000 / (now - fpsLast));
                fpsLabel.textContent = fps + ' FPS';
                fpsFrames = 0;
                fpsLast = now;
            }

            renderer.render(scene, camera);
        }

        function handleViewportResize() {
            syncTelegramLayout();
            if (!isRecording) applyRenderSize();
        }

        window.addEventListener('resize', handleViewportResize);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', handleViewportResize);
        if (telegram && typeof telegram.onEvent === 'function') {
            telegram.onEvent('viewportChanged', handleViewportResize);
            telegram.onEvent('safeAreaChanged', syncTelegramLayout);
            telegram.onEvent('contentSafeAreaChanged', syncTelegramLayout);
            telegram.onEvent('fullscreenChanged', handleViewportResize);
        }

        restoreState();
        applyRenderSize();
        syncTelegramBackButton();
        animate();
        toast('H — меню · Space — play · ? — клавиши');
    })();
    </script>
</body>
</html>
